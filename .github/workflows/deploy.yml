# Builds the site and publishes a preview mirror to GitHub Pages on every push to main.
name: Deploy preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      # Production is walnutdatatech.com (deployed with `npm run deploy`). This Pages copy is a preview
      # mirror: built for its own URL, hidden from search engines, and without the payment API.
      - name: Build and check
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          NOINDEX: '1'
        run: |
          node build.mjs
          node check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
